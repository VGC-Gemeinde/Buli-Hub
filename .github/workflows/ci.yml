# CI on every push/PR; CD to Cloud Run on main after CI passes.
# Deploy configuration lives in the repo's PROD environment
# (docs/deployment.md §3):
#   Variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_SERVICE,
#              GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA,
#              NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   Secrets:   PROD_DATABASE_URL
#
# `dev` runs the same checks and then deploys to staging via
# .github/workflows/staging.yml (docs/deployment.md §7).
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # supabase/config.toml substitutes these via env(); dummies suffice for
      # the CI stack (nobody signs in with Discord here).
      SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ci-dummy
      SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      # The integration tests need the real local stack: they write to the
      # Supabase-managed auth schema, which plain Postgres does not have.
      #
      # Pinned, not `latest`: with `latest` the action resolves the release
      # through the GitHub API on every run, and that call is rate-limited per
      # runner IP — it failed two consecutive runs with "Failed to resolve latest
      # Supabase CLI release: rate limit exceeded", blocking the deploy for
      # reasons unrelated to the code. A pinned tag is downloaded directly, with
      # no API lookup, so CI no longer depends on a shared quota. Bump
      # deliberately; keep it in step with the CLI used locally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - run: supabase start
      - run: supabase db reset
      - run: npm test -- --run
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy
          SUPABASE_SECRET_KEY: ci-dummy

  # One job, two targets. `main` deploys to PROD, `dev` to STAGING; every
  # vars.*/secrets.* below then resolves from whichever environment is
  # selected, so the two deployments cannot drift apart in their steps.
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: checks
    runs-on: ubuntu-latest
    # All deploy variables/secrets live in this environment (single source
    # of truth) — without declaring it, none of them resolve.
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'STAGING' }}
    # Serialize deploys per target; a superseded run is cancelled before it
    # ships. Staging and production never queue behind each other.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL='${{ vars.NEXT_PUBLIC_SUPABASE_URL }}' \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}' \
            -t "$IMAGE" .
          docker push "$IMAGE"
      # Migrations ship in the same commit as the code using them (CLAUDE.md);
      # apply them right before the new revision goes live.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # STAGING defines STAGING_DATABASE_URL; PROD does not, so the fallback
      # picks PROD_DATABASE_URL there. Both are *session* connection strings
      # (port 5432) — migrations need DDL over a stable session.
      - name: Apply migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || secrets.PROD_DATABASE_URL }}
      # --update-env-vars, not --set-env-vars: the service's other environment
      # variables are configured on Cloud Run itself and must survive a deploy.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy '${{ vars.GCP_SERVICE }}' \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --update-env-vars "APP_BUILD_SHA=${{ github.sha }}" \
            --quiet
